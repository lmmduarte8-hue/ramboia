<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAMBOIA OFFLINE</title><link rel="icon" href="IMG-20261021-WA8596.jpg"><link rel="apple-touch-icon" href="IMG-20261021-WA8596.jpg"><meta name="theme-color" content="#0D2A54"><style>*{box-sizing:border-box}body{margin:0;background:#EEF1F5;font-family:Arial}header{background:#0D2A54;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}header span{color:#FFC107}.wrap{padding:12px 14px 100px 14px}.search{width:100%;padding:16px;border-radius:16px;border:0;box-shadow:0 2px 10px #0001;font-size:16px}.row{display:flex;gap:10px;margin:12px 0}.btn{flex:1;padding:16px;border:0;border-radius:16px;font-weight:800}.btn-y{background:#FFC107;color:#000}.btn-b{background:#0D2A54;color:#fff}.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:99}.modal.on{display:flex}.modal-box{background:#fff;width:100%;border-radius:28px 28px 0 0;padding:20px;max-height:90vh;overflow:auto}.modal-box input,.modal-box select{width:100%;padding:16px;margin:8px 0;border-radius:14px;border:1.5px solid #ddd;font-size:16px}</style></head><body><header><b>CORTANTES <span>RAMBOIA</span></b><button id="btnExport" style="padding:8px 14px;border-radius:20px;border:0;background:#FFC107;font-weight:800">Excel</button></header><div class="wrap"><input id="q" class="search" placeholder="Procurar..."><div class="row"><button id="btnSub" class="btn btn-y">Sub (0)</button><button id="btnNova" class="btn btn-b">+ Nova</button></div><div id="lista"></div></div><div class="modal" id="modal"><div class="modal-box"><h3 id="mtit">Nova</h3><input id="fr" placeholder="Referencia *"><input id="fl" placeholder="Local"><select id="fs"><option>Em Armazem</option><option>Subcontrato</option></select><div id="subF" style="display:none"><input id="fe" placeholder="Empresa"><input id="fd" type="date"></div><div style="display:flex;gap:10px;margin-top:16px"><button id="btnCancel" class="btn" style="background:#E9ECEF">Cancelar</button><button id="btnSave" class="btn btn-b">Guardar</button></div></div></div><script>let D=JSON.parse(localStorage.getItem('ramboia_dados')||'[]'),filtro=false,oldRef='';const $=id=>document.getElementById(id);function save(){localStorage.setItem('ramboia_dados',JSON.stringify(D))}$('btnSub').onclick=()=>{filtro=!filtro;render()};$('btnNova').onclick=()=>{oldRef='';$('mtit').innerText='Nova';$('fr').value='';$('fl').value='';$('fe').value='';$('fd').value='';$('fs').value='Em Armazem';$('subF').style.display='none';$('modal').classList.add('on')};$('btnCancel').onclick=()=>$('modal').classList.remove('on');$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('on')};$('fs').onchange=function(){$('subF').style.display=this.value==='Subcontrato'?'block':'none'};$('q').oninput=render;$('btnSave').onclick=()=>{const o={ref:$('fr').value.trim(),local:$('fl').value.trim(),status:$('fs').value,empresa:$('fe').value.trim(),data:$('fd').value};if(!o.ref){alert('Falta referencia');return}const alvo=String(oldRef||o.ref).toLowerCase().trim();let idx=D.findIndex(x=>String(x.ref).toLowerCase().trim()===alvo);if(idx>=0)D[idx]=o;else D.push(o);save();$('modal').classList.remove('on');render()};$('btnExport').onclick=()=>{let csv="Referencia,Local,Status,Empresa,Data\n"+D.map(x=>`${x.ref},${x.local},${x.status},${x.empresa},${x.data}`).join("\n");let b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='ramboia.csv';a.click()};function render(){const q=$('q').value.toLowerCase();const f=D.filter(x=>{const t=(x.ref+' '+x.local+' '+x.empresa).toLowerCase();if(filtro&&x.status!=='Subcontrato')return false;if(q&&!t.includes(q))return false;return true});$('btnSub').innerText='Sub ('+D.filter(x=>x.status==='Subcontrato').length+')';const L=$('lista');if(!D.length){L.innerHTML='<p style="text-align:center;color:#888;margin-top:50px">Sem refs<br>Clica + Nova</p>';return}L.innerHTML=f.map(x=>{const r=x.ref.replace(/'/g,"\\'");return `<div class="card"><b>${x.ref}</b> - ${x.status}<br><small>Local: ${x.local} ${x.empresa?'- '+x.empresa:''} ${x.data?'| '+x.data:''}</small><div style="display:flex;gap:8px;margin-top:10px"><button style="flex:1;padding:10px;border-radius:10px;border:0;background:#EEF1F5" onclick="edit('${r}')">Editar</button><button style="flex:1;padding:10px;border-radius:10px;border:0;background:#FFE0E0" onclick="del('${r}')">Apagar</button></div></div>`}).join('')}window.edit=r=>{const x=D.find(a=>String(a.ref).toLowerCase()===r.toLowerCase());if(!x)return;oldRef=x.ref;$('mtit').innerText='Editar '+x.ref;$('fr').value=x.ref;$('fl').value=x.local;$('fe').value=x.empresa;$('fd').value=x.data;$('fs').value=x.status;$('subF').style.display=x.status==='Subcontrato'?'block':'none';$('modal').classList.add('on')};window.del=r=>{if(confirm('Apagar '+r+'?')){D=D.filter(x=>String(x.ref).toLowerCase()!==r.toLowerCase());save();render()}};render()</script></body></html>
